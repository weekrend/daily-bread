<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍞 Daily Bread Generator</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 500px;
  margin: auto;
  background: #f9f9f9;
}

h2 { text-align: center; }

input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}

textarea {
  box-sizing: border-box;
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-family: monospace;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  background: #333;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #555;
}

.result {
  margin-top: 15px;
  padding: 10px;
  background: #f5f5f5;
  border-radius: 8px;
  word-break: break-all;
}

.qr {
  text-align: center;
  margin-top: 20px;
}

.qr img {
  border-radius: 10px;
}
</style>
</head>

<body>

<h2>🍞 Daily Bread Generator</h2>

<label>Name</label>
<input id="name" placeholder="Anna ♡ Noah">

<label>Type</label>
<select id="type">
  <option value="love">❤️ Love</option>
  <option value="peace">🌿 Peace</option>
  <option value="strength">✝️ Strength</option>
  <option value="guidance">✨ Guidance</option>
</select>

<label>Date (for love only)</label>
<input id="date" placeholder="08.12.2022">

<label>Message (optional)</label>
<input id="msg" placeholder="Be still / Keep going">

<button onclick="generate()">Generate</button>

<div class="result" id="result"></div>

<button onclick="copy()">Copy Link</button>

<label for="registryEntry">New customer registry entry</label>
<textarea id="registryEntry" rows="7" readonly placeholder="Generate a link to create a registry entry"></textarea>
<div class="result">
  After generating a QR, download the updated <code>customers.json</code> and publish it to GitHub Pages. The new QR will only work after that file is deployed.
</div>
<button onclick="downloadRegistry()">Download customers.json</button>

<div class="qr">
  <img id="qrImg" width="200" />
  <br>
  <button onclick="downloadQR()">Download QR</button>
</div>

<script>
let currentQR = "";
let registryData = null;

async function loadRegistry() {
  if (registryData !== null) return registryData;

  const response = await fetch("customers.json", { cache: "no-store" });
  if (!response.ok) throw new Error("Could not load customers.json");
  registryData = await response.json();
  return registryData;
}

function createID() {
  const bytes = new Uint8Array(9);
  crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode(...bytes))
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/g, "");
}

async function generate() {

  const nameRaw = document.getElementById("name").value.trim();
  const type = document.getElementById("type").value;
  const dateRaw = document.getElementById("date").value.trim();
  const msgRaw = document.getElementById("msg").value.trim();

  if (!nameRaw) {
    alert("Please enter name");
    return;
  }

  try {
    await loadRegistry();
  } catch (error) {
    alert("Could not load customers.json. Open the published generator page and try again.");
    return;
  }

  let id = createID();
  while (Object.prototype.hasOwnProperty.call(registryData, id)) id = createID();

  const customer = { name: nameRaw, type };

  if (type === "love" && dateRaw) {
    customer.date = dateRaw;
  }

  if (type !== "love" && msgRaw) {
    customer.msg = msgRaw;
  }

  registryData[id] = customer;

  const url = new URL("./", location.href);
  url.searchParams.set("i", id);
  document.getElementById("result").innerText = url.toString();
  document.getElementById("registryEntry").value = JSON.stringify({ [id]: customer }, null, 2);

  // Download a high-resolution QR with standard error correction.
  currentQR = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&ecc=M&margin=4&data=" + encodeURIComponent(url.toString());
  document.getElementById("qrImg").src = currentQR;
}

function downloadRegistry() {
  if (registryData === null) {
    alert("Generate at least one QR code first.");
    return;
  }

  const file = new Blob([JSON.stringify(registryData, null, 2)], { type: "application/json" });
  const fileURL = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = fileURL;
  a.download = "customers.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(fileURL), 1000);
}

function copy() {
  const text = document.getElementById("result").innerText;
  if (!text) return;

  navigator.clipboard.writeText(text);
  alert("Link copied!");
}

function downloadQR() {
  if (!currentQR) return;

  const a = document.createElement("a");
  a.href = currentQR;
  a.download = "daily-bread-qr.png";
  a.click();
}
</script>

</body>
</html>
